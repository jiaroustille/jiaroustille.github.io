<script>
  document.addEventListener("DOMContentLoaded", () => {
    const btn = document.querySelector(".share-inline");
    const url = "{{ site.url }}{{ page.url }}";

    btn.addEventListener("click", () => {
      navigator.clipboard.writeText(url);

      btn.classList.add("copied");
      setTimeout(() => btn.classList.remove("copied"), 1200);
    });
  });
</script>
<style>
  .share-inline {
    background: none;
    border: none;
    cursor: pointer;
    margin-left: var(--xs);
    padding: var(--xxs);
    font-size: var(--lg);
    line-height: 1;
    display: inline-flex;
    align-items: center;
    color: var(--highlight);
    opacity: 0.7;
  }

  .share-inline:hover {
    opacity: 1;
  }

  .share-inline::before {
    content: "⛬";
    display: inline-block;
    transform: rotate(270deg);
    margin-right: -1.5rem;
    font-weight: 700;
  }

  .share-inline::after {
    content: "V";
    font-weight: 100;
    transform: rotate(90deg);
  }

  .share-inline.copied::before {
    content: "✓";
    transform: rotate(0deg);
  }
  .share-inline.copied::after {
    content: "";
  }
</style>
